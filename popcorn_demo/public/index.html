<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>mnft · popcorn_demo — BEAM in the browser</title>
    <style>
      :root {
        --bg: #0d0f14;
        --panel: #14161c;
        --edge: #23262e;
        --text: #d7dae2;
        --dim: #8a90a0;
        --accent: #f5a524;
        --ok: #7dd487;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h1 span { color: var(--accent); }
      p.sub { color: var(--dim); margin: 0 0 28px; font-size: 13px; }
      #status {
        font-size: 13px;
        color: var(--dim);
        padding: 6px 14px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        margin-bottom: 24px;
      }
      #status[data-up="true"] { color: var(--ok); border-color: var(--ok); }
      #facts {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 18px 22px;
        width: min(560px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .fact { display: flex; gap: 14px; font-size: 13px; align-items: baseline; }
      .fact .k { color: var(--dim); min-width: 170px; font-family: ui-monospace, monospace; font-size: 11px; }
      .fact .v { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>mnft <span>popcorn_demo</span></h1>
    <p class="sub">an unmodified Elixir supervision tree, journalling to ETS — inside this browser tab</p>
    <p id="status">Starting Popcorn…</p>
    <div id="facts"></div>
    <script type="module">
      import { Popcorn } from "./out/index.mjs";
      await Popcorn.init();
    </script>
  </body>
</html>
