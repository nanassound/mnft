name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  elixir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/repo
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Python worker env
        run: |
          cd cad_worker
          uv venv --python 3.12
          uv pip install -e ".[smlibpy]" pytest
      - name: Compile core
        run: cd mnft_cad && mix deps.get && mix compile --warnings-as-errors
      - name: Install poppler (reference-PDF tests)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install poppler
          else
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
      - name: Core tests
        run: cd mnft_cad && mix test
      - name: Reference web app
        run: cd mnft_cad_web && mix deps.get && mix compile --warnings-as-errors && mix test
      - name: Headless example
        run: cd mnft_cad_headless && mix deps.get && mix compile --warnings-as-errors && MNFT_HEADLESS_FAKE=1 mix run -e "MnftCadHeadless.run()"
      - name: Python worker tests
        run: cd cad_worker && .venv/bin/python -m pytest -q
